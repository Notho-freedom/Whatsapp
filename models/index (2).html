<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   WhatsApp Clone - Smaller Header Icons
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
     font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
     background-color: #121212;
     margin: 0;
     height: 100vh;
     display: flex;
     justify-content: center;
     align-items: start;
     padding-top: 0;
   }
   /* Scrollbar for chat list */
   #chat-list {
     scrollbar-width: thin;
     scrollbar-color: #9F9F9F transparent;
     overflow-y: auto;
   }
   #chat-list::-webkit-scrollbar {
     width: 4px;
     transition: width 0.3s ease;
   }
   #chat-list:hover::-webkit-scrollbar {
     width: 8px;
   }
   #chat-list::-webkit-scrollbar-thumb {
     background-color: #9F9F9F;
     border-radius: 3px;
   }
   /* Container for time aligned with name */
   .header-row {
     display: flex;
     justify-content: space-between;
     align-items: center;
   }
   .chat-time {
     white-space: nowrap;
     font-size: 0.65rem; /* smaller than text-xs */
     color: #9ca3af; /* Tailwind gray-400 */
     flex-shrink: 0;
     line-height: 1;
   }
   /* Container for message and notification dot aligned horizontally */
   .message-row {
     display: flex;
     justify-content: space-between;
     align-items: center;
     margin-top: 2px;
   }
   .message-text {
     color: #9ca3af;
     font-size: 0.75rem;
     overflow: hidden;
     text-overflow: ellipsis;
     white-space: nowrap;
     max-width: 180px;
   }
   .notif-dot {
     width: 18px;
     height: 18px;
     background-color: #00a884;
     border-radius: 9999px;
     font-size: 0.65rem;
     font-weight: 600;
     color: #121212;
     display: flex;
     align-items: center;
     justify-content: center;
     padding: 0 6px;
     margin-left: 6px;
     flex-shrink: 0;
   }
   /* Remove chat item borders */
   #chat-list > button {
     border-bottom: none !important;
     padding-bottom: 0.75rem;
     margin-bottom: 0.75rem;
   }
   /* Background colors */
   #chat-list {
     background-color: #2C2C2C;
     height: 100%;
     padding: 0.75rem 0;
   }
   #chat-list > button[aria-current="true"] {
     background-color: #454545;
   }
   /* Search input background */
   .search-input {
     background-color: #3D3D3D;
     border-bottom: 1px solid rgba(255 255 255 / 0.15);
     backdrop-filter: saturate(180%) blur(20px);
     border-radius: 0.375rem;
   }
   /* Container for entire chat list component */
   .chat-list-container {
     width: 320px;
     height: 100vh;
     background-color: #2C2C2C;
     display: flex;
     flex-direction: column;
   }
   /* Smaller header icons */
   .header-icons {
     font-size: 0.85rem; /* smaller than text-lg */
   }
  </style>
 </head>
