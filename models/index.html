<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   WhatsApp Clone - Titlebar
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
 </head>
 <body class="bg-[#121212] text-white select-none h-screen flex flex-col">
  <!-- Titlebar -->
  <header class="flex items-center justify-between bg-[#1e1e1e] px-3 h-8 text-xs text-white">
   <div class="flex items-center space-x-2">
    <img alt="WhatsApp logo green circle with white phone icon" class="w-4 h-4" src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"/>
    <span class="font-normal">
     WhatsApp
    </span>
   </div>
   <div class="flex items-center space-x-2 text-[10px] font-semibold">
    <button aria-label="Minimize" class="w-4 h-4 flex items-center justify-center hover:bg-gray-600 rounded-sm">
     <svg fill="none" height="2" stroke="currentColor" stroke-width="2" viewbox="0 0 12 2" width="12" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" x2="12" y1="1" y2="1"></line>
     </svg>
    </button>
    <button aria-label="Maximize" class="w-4 h-4 flex items-center justify-center hover:bg-gray-600 rounded-sm">
     <svg fill="none" height="12" stroke="currentColor" stroke-width="2" viewbox="0 0 12 12" width="12" xmlns="http://www.w3.org/2000/svg">
      <rect height="10" width="10" x="1" y="1"></rect>
     </svg>
    </button>
    <button aria-label="Close" class="w-4 h-4 flex items-center justify-center hover:bg-red-600 rounded-sm">
     <svg fill="none" height="12" stroke="currentColor" stroke-width="2" viewbox="0 0 12 12" width="12" xmlns="http://www.w3.org/2000/svg">
      <line x1="1" x2="11" y1="1" y2="11"></line>
      <line x1="11" x2="1" y1="1" y2="11"></line>
     </svg>
    </button>
   </div>
  </header>
 </body>
</html>
