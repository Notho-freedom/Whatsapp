<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   WhatsApp Clone - Chat Header Refined Icons and Separator
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
     font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
     background-color: #121212;
     margin: 0;
     height: 100vh;
     display: flex;
     justify-content: center;
     align-items: start;
     padding-top: 0;
   }
   .icon-buttons {
     font-size: 1.25rem; /* keep button size */
     display: flex;
     gap: 0.75rem;
     color: #9ca3af;
     align-items: center;
   }
   /* Join video and audio buttons with very small gap */
   .icon-buttons .video-audio-group {
     display: flex;
     gap: 0.1rem; /* very tight gap */
   }
   .icon-buttons .video-audio-group button {
     padding: 0.4rem 0.5rem;
     border-radius: 0.375rem;
     display: flex;
     align-items: center;
     justify-content: center;
     transition: background-color 0.3s ease;
     cursor: pointer;
     background-color: rgba(255 255 255 / 0.1);
     backdrop-filter: saturate(180%) blur(20px);
   }
   .icon-buttons .video-audio-group button:first-child {
     border-top-right-radius: 0;
     border-bottom-right-radius: 0;
   }
   .icon-buttons .video-audio-group button:last-child {
     border-top-left-radius: 0;
     border-bottom-left-radius: 0;
   }
   .icon-buttons .video-audio-group button:hover {
     background-color: rgba(255 255 255 / 0.2);
     color: white;
   }
   /* Search button with no background but same size */
   .icon-buttons > button {
     padding: 0.4rem 0.5rem;
     border-radius: 0.375rem;
     display: flex;
     align-items: center;
     justify-content: center;
     cursor: pointer;
     background: none;
     font-size: 1rem; /* smaller icon */
     transition: color 0.3s ease;
   }
   .icon-buttons > button:hover {
     color: white;
   }
   .icon-buttons i {
     pointer-events: none;
   }
  </style>
 </head>
 <body>
  <header class="flex items-center justify-between px-4 py-3 bg-[#1e1e1e] w-full max-w-4xl border-b border-gray-700">
   <div class="flex items-center gap-3">
    <img alt="Inès child smiling wearing a red shirt in a circle" class="w-10 h-10 rounded-full object-cover" src="https://placehold.co/40x40/png?text=Ines+Child+Smiling+Red+Shirt"/>
    <div>
     <p class="font-semibold text-white text-sm">
      Inès
     </p>
     <p class="text-xs text-gray-400">
      last seen today at 6:39 PM
     </p>
    </div>
   </div>
   <div class="icon-buttons">
    <div class="video-audio-group">
     <button aria-label="Video call" type="button">
      <i class="fas fa-video">
      </i>
     </button>
     <button aria-label="Voice call" type="button">
      <i class="fas fa-phone">
      </i>
     </button>
    </div>
    <button aria-label="Search" type="button">
     <i class="fas fa-search">
     </i>
    </button>
   </div>
  </header>
 </body>
</html>
