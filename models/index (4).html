<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   WhatsApp Clone - Chat Footer Smaller Icons
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
     font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
     background-color: #121212;
     margin: 0;
     height: 100vh;
     display: flex;
     justify-content: center;
     align-items: start;
     padding-top: 0;
   }
   footer button i {
     font-size: 1rem; /* smaller than text-xl */
   }
  </style>
 </head>
 <body>
  <footer class="flex items-center gap-3 px-4 py-2 border-t border-gray-700 bg-[#1e1e1e] w-full max-w-4xl">
   <button aria-label="Emoji picker" class="text-gray-400 hover:text-white">
    <i class="far fa-smile">
    </i>
   </button>
   <button aria-label="Attach file" class="text-gray-400 hover:text-white">
    <i class="fas fa-paperclip">
    </i>
   </button>
   <input aria-label="Type a message" class="flex-1 bg-[#2a2a2a] rounded-full py-2 px-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-[#00a884]" placeholder="Type a message" type="text"/>
   <button aria-label="Send message" class="text-gray-400 hover:text-white">
    <i class="fas fa-microphone">
    </i>
   </button>
  </footer>
 </body>
</html>
